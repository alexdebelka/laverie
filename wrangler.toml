# Cloudflare Workers configuration.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "laverie"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Static PWA served from ./public. API routes under /api/* are handled by the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 database. Create it once with:  npx wrangler d1 create laverie
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "laverie"
database_id = "3d8e1003-8463-4c35-89f2-33e836a3149b"
migrations_dir = "migrations"

[vars]
# Minutes a finished machine stays "done" before it is automatically freed (no one tapped "collected").
DONE_GRACE_MIN = "45"
# Days a "broken" flag survives without anyone tapping "fixed" or reporting it again.
BROKEN_TTL_DAYS = "7"
# Weeks of anonymous events kept for the busy-hours chart. Older rows are pruned.
EVENT_RETENTION_WEEKS = "8"

[observability]
enabled = false
